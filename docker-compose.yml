services:
  db:
    image: postgres:16-alpine
    container_name: vellura-dental-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vellura
      POSTGRES_PASSWORD: vellura
      POSTGRES_DB: vellura_dental
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - vellura_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vellura -d vellura_dental"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vellura_pgdata:
